function itemSum(h){ const s={dmg:0,hp:0,spd:0,cdr:0,ls:0,regen:0,as:0}; for (const id of h.items){ const fx=ITEMS.find(i=>i.id===id).fx; for (const k in fx) s[k]+=fx[k]; } return s; }
function recalc(h){
  const k=h.lvl-1, it=itemSum(h), old=h.maxHp;
  h.maxHp=Math.round(h.def.hp*(1+.07*k)*(1+h.baseHp)+it.hp);
  h.dmg=(h.def.dmg*(1+.055*k)+it.dmg)*(1+h.baseDmg);
  h.spdMul=1+it.spd; h.cdrMul=1-Math.min(.4,it.cdr); h.ls=it.ls; h.regen=it.regen; h.asMul=1+it.as;
  if (h.maxHp>old) h.hp+=h.maxHp-old; h.hp=Math.min(h.hp,h.maxHp);
}
const xpNeed = l => 36+24*l;
function giveXp(h,x){
  if (!h || h.lvl>=MAXLVL) return;
  h.xp+=x;
  while (h.lvl<MAXLVL && h.xp>=xpNeed(h.lvl)){
    h.xp-=xpNeed(h.lvl); h.lvl++; h.points++; recalc(h);
    G.rings.push({x:h.x,y:h.y,r0:10,r1:60,t:0,life:.6,col:'#ffc25a',w:4});
    if (h===G.me){ sfx('lvl'); toast(learnable(h).length ? t('pickSkill',{n:h.lvl}) : t('lvlUp',{n:h.lvl})); }
    else autoLearn(h);
  }
  if (h.lvl>=MAXLVL) h.xp=0;
}
function giveGold(h,g,at){ if (!h || g<=0) return; h.gold+=g; if (h===G.me){ G.stats.gold+=g; if (at) text(at.x,at.y-26,'+'+g,'#ffc25a'); sfx('coin'); } }

/* ---------- Skill ranks ---------- */
function maxRank(h,i){ const s=h.def.skills[i]; return s.ult ? ULT_LVLS.filter(l=>h.lvl>=l).length : Math.min(4,Math.ceil(h.lvl/2)); }
function canLearn(h,i){ return i>=1 && h.points>0 && h.ranks[i] < maxRank(h,i); }
function learnable(h){ return [1,2,3,4].filter(i=>canLearn(h,i)); }
function learn(h,i){ if (!canLearn(h,i)) return; h.ranks[i]++; h.points--; if (h===G.me){ sfx('buy'); const s=h.def.skills[i]; toast(t('learn',{s:L(s.n)})+' — '+L(s.d)); } }
function autoLearn(h){
  let guard=10;
  while (h.points>0 && guard--){
    if (canLearn(h,4)){ learn(h,4); continue; }
    const order=BOT_SKILLS[h.key]; const opts=order.filter(i=>canLearn(h,i));
    if (!opts.length) break;
    opts.sort((a,b)=>h.ranks[a]-h.ranks[b]||order.indexOf(a)-order.indexOf(b)); learn(h,opts[0]);
  }
}
const cdOf = (h,i) => { const s=h.def.skills[i]; return s.cd[Math.max(0,h.ranks[i]-1)]*h.cdrMul; };

/* ---------- Helpers ---------- */
function coreOpen(team){ return G.ents.some(e=>e.kind==='tower'&&e.team===team&&e.dead); }
function targetable(e,byTeam){
  if (!e || e.dead || e.team===byTeam) return false;
  if (e.kind==='hero' && e.invis>0) return false;
  if (e.kind==='core' && !coreOpen(e.team)) return false;
  return true;
}
const enemyHeroOf = team => team===0 ? G.bot : G.me;
function nearestEnemy(h,range,preferHero){
  const eh=enemyHeroOf(h.team);
  if (preferHero && targetable(eh,h.team) && dist(h,eh)<=range) return eh;
  let best=null, bd=1e9;
  for (const e of G.ents){ if (e.kind!=='minion'&&e.kind!=='hero') continue; if (!targetable(e,h.team)) continue; const d=dist(h,e); if (d<=range&&d<bd){bd=d;best=e;} }

function enemiesIn(x,y,r,team){ return G.ents.filter(e=>!e.dead && e.team!==team && (e.kind==='hero'||e.kind==='minion') && Math.hypot(e.x-x,e.y-y)<=r+e.r*.5); }

let toastT=0;

/* ---------- Damage, kills, rewards ---------- */
function hit(t2,amt,src){
  if (!t2 || t2.dead || G.over) return;
  if (t2.drT>0) amt*=1-t2.dr;
  if (t2.shieldT>0 && t2.shield>0){ const a=Math.min(t2.shield,amt); t2.shield-=a; amt-=a; }
  t2.hp-=amt; t2.flash=.1;
  if (src && src.kind==='hero'){ if (t2.kind==='hero') src.aggroT=2.5; if (src.ls>0) src.hp=Math.min(src.maxHp,src.hp+amt*src.ls); }
  if (amt>=1 && (src===G.me || t2===G.me)) text(t2.x+rand(-6,6), t2.y-t2.r-14, Math.round(amt), t2===G.me?'#ff7a7a':'#ffffff', src===G.me&&amt>t2.maxHp*.12);
  if (t2.hp<=0) die(t2,src);
}
function die(v,src){
  v.dead=true; v.hp=0;
  const foe=enemyHeroOf(v.team), lastHit = src===foe;
  if (v.kind==='minion'){
    burst(v.x,v.y,TC[v.team],10,60,.5);
    if (lastHit){ giveGold(foe,v.D.gold,v); giveXp(foe,v.D.xp); if (foe===G.me) G.stats.cs++; }
    else if (!foe.dead && dist(foe,v)<340){ giveXp(foe,Math.round(v.D.xp*.4)); giveGold(foe,3); }
  } else if (v.kind==='hero'){
    v.respawn=4+v.lvl*1.1; v.dash=null; v.kb=null; v.invis=0;
    burst(v.x,v.y,v.def.col,40,140,.9); burst(v.x,v.y,'#ffffff',14,90,.5);
    G.rings.push({x:v.x,y:v.y,r0:10,r1:90,t:0,life:.6,col:v.def.col,w:5}); sfx('die');
    const g=220+15*v.lvl, x=110+22*v.lvl, share=lastHit?1:.6;
    giveGold(foe,Math.round(g*share)); giveXp(foe,Math.round(x*share));
    if (v===G.me){ G.stats.d++; toast(t('youDied')); } else { G.stats.k++; toast(t('killedHero',{h:v.def.name,g:Math.round(g*share)})); }
  } else if (v.kind==='tower'){
    burst(v.x,v.y-20,'#ffb070',60,160,1.1,4); burst(v.x,v.y-20,'#444',30,60,1.6,6);
    G.shake=.5; sfx('tower');
    giveGold(foe,180+(lastHit?120:0),v); giveXp(foe,150+(lastHit?60:0));
    toast(v.team===1 ? t('towerDown') : t('towerLost'));
  } else if (v.kind==='core'){

}
function stun(e,s){ if (e.kind==='hero'||e.kind==='minion'){ e.stun=Math.max(e.stun||0,s); if (e.dash) e.dash=null; } }

/* ---------- Skills (power scales with rank r) ---------- */

const SK = {

      h.x=clamp(h.x+d.x*135,20,MW-20); h.y=clamp(h.y+d.y*135,20,MH-20); pushOut(h);

    (h,r)=>{ const tg=nearestEnemy(h,290,true); if (!tg) return false;
      G.zones.push({k:'rain',x:tg.x,y:tg.y,r:72,t:0,dur:2,tick:0,team:h.team,dmg:25+18*r+3*h.lvl,slow:.3+.05*r,src:h}); return true; },
    (h,r)=>{ h.invis=2.5+.5*r; h.crit=true; h.critMul=2+.25*r; h.haste=h.invis; burst(h.x,h.y,'#3a2a6a',20,60,.6); return true; },

    (h,r)=>{ const tg=nearestEnemy(h,235,true); if (!tg) return false; h.dash={tgt:tg,spd:540,t:.7,dmg:60+45*r+4*h.lvl,stun:.8+.15*r}; return true; },
    (h,r)=>{ for (const e of enemiesIn(h.x,h.y,95,h.team)){ hit(e,70+50*r+4*h.lvl,h); const a=Math.atan2(e.y-h.y,e.x-h.x); e.kb={vx:Math.cos(a)*300,vy:Math.sin(a)*300,t:.25}; }

};
function cast(h,i){
  const s=h.def.skills[i];

/* ---------- Movement ---------- */
function pushOut(u){
  for (const s of G.ents){ if ((s.kind!=='tower'&&s.kind!=='core')||s.dead) continue; const d=dist(u,s), m=u.r+s.r*.8; if (d<m&&d>0){ u.x=s.x+(u.x-s.x)/d*m; u.y=s.y+(u.y-s.y)/d*m; } }
  u.x=clamp(u.x,16,MW-16); u.y=clamp(u.y,16,MH-16);
}
function speedOf(u,base){ let s=base*(u.spdMul||1); if (u.slowT>0) s*=1-u.slow; if (u.haste>0) s*=1.3; return s; }
function moveTowards(u,tx,ty,spd,dt,stopAt){
  const dx=tx-u.x, dy=ty-u.y, d=Math.hypot(dx,dy);
  if (d<=(stopAt||4)){ u.moving=false; return true; }
  const st=Math.min(d,spd*dt); u.x+=dx/d*st; u.y+=dy/d*st; u.mv={x:dx/d,y:dy/d}; u.face=u.mv; u.moving=true; return false;
}

/* ---------- Heroes ---------- */
function heroAttack(h,tg){
  h.atkCd=h.def.cd/((1+.02*(h.lvl-1))*h.asMul);
  const d0=dist(h,tg)||1; h.face={x:(tg.x-h.x)/d0, y:(tg.y-h.y)/d0};
  let d=h.dmg*(h.team===1?.82:1);
  if (h.key==='vael'){
    if (h.markTgt===tg) h.markN++; else { h.markTgt=tg; h.markN=1; }
    if (h.markN>=3){ d*=1.8; h.markN=0; G.rings.push({x:tg.x,y:tg.y,r0:6,r1:30,t:0,life:.35,col:'#7ff0ff',w:3}); }
    if (h.crit){ d*=h.critMul; h.crit=false; }
    h.invis=0;
    G.projs.push({x:h.x,y:h.y-8,tgt:tg,spd:560,dmg:d,src:h,col:'#c58bff',w:3});
    if (h===G.me) sfx('shot');
  } else {
    hit(tg,d,h); G.slashes.push({x:tg.x,y:tg.y,a:Math.atan2(tg.y-h.y,tg.x-h.x),t:0,life:.22,col:'#ffc25a'}); burst(tg.x,tg.y,'#ffcf8a',6,70,.3);
    if (h===G.me) sfx('hit');
  }
}
function pickHeroTarget(h){
  const R=h.range+h.r, eh=enemyHeroOf(h.team);
  if (targetable(eh,h.team) && dist(h,eh)<=R+eh.r) return eh;
  let best=null, bd=1e9;
  for (const e of G.ents){ if (e===eh || !targetable(e,h.team)) continue; const d=dist(h,e)-e.r; if (d<=R && d<bd){ bd=d; best=e; } }
  return best;
}
function updateHero(h,dt){
  if (h.dead){ h.respawn-=dt; if (h.respawn<=0){ h.dead=false; h.hp=h.maxHp; const s=SPAWN[h.team]; h.x=s.x; h.y=s.y; h.stun=h.root=h.slowT=0; if (h===G.me) toast(t('back')); } return; }
  for (let i=1;i<5;i++) h.cds[i]=Math.max(0,h.cds[i]-dt);
  h.atkCd-=dt; h.flash=Math.max(0,h.flash-dt); h.aggroT=Math.max(0,h.aggroT-dt);
  h.stun=Math.max(0,h.stun-dt); h.root=Math.max(0,h.root-dt); h.invis=Math.max(0,h.invis-dt); h.haste=Math.max(0,h.haste-dt);
  if (h.slowT>0) h.slowT-=dt; if (h.shieldT>0) h.shieldT-=dt; if (h.drT>0) h.drT-=dt;
  h.gold+=2.5*dt; if (h===G.me) G.stats.gold+=2.5*dt;
  if (h.regen) h.hp=Math.min(h.maxHp,h.hp+h.maxHp*h.regen*dt);
  if (inBase(h)) h.hp=Math.min(h.maxHp,h.hp+h.maxHp*.12*dt);
  const esp=SPAWN[1-h.team]; if (Math.hypot(h.x-esp.x,h.y-esp.y)<95) hit(h,h.maxHp*.2*dt,null);
  if (h.key==='korr' && G.ents.some(e=>e.kind==='tower'&&!e.dead&&e.team===h.team&&dist(e,h)<210)) h.hp=Math.min(h.maxHp,h.hp+h.maxHp*.025*dt);
  if (h.kb){ h.x+=h.kb.vx*dt; h.y+=h.kb.vy*dt; h.kb.t-=dt; if (h.kb.t<=0) h.kb=null; pushOut(h); return; }
  if (h.dash){
    const tg=h.dash.tgt; h.dash.t-=dt;
    if (tg.dead || h.dash.t<=0) h.dash=null;
    else if (moveTowards(h,tg.x,tg.y,h.dash.spd,dt,h.r+tg.r)){ hit(tg,h.dash.dmg,h); stun(tg,h.dash.stun); G.rings.push({x:tg.x,y:tg.y,r0:8,r1:50,t:0,life:.35,col:'#ffb547',w:4}); G.shake=.2; h.dash=null; }

function controlPlayer(h,dt){
  const m=Math.hypot(input.x,input.y);
  if (m>.18 && h.root<=0){ h.mv={x:input.x/m,y:input.y/m}; h.face=h.mv; h.moving=true; const s=speedOf(h,h.def.spd)*Math.min(1,m); h.x+=h.mv.x*s*dt; h.y+=h.mv.y*s*dt; }
  else { h.moving=false; if (h.atkCd<=0){ const tg=pickHeroTarget(h); if (tg) heroAttack(h,tg); } }
}

/* ---------- Bot (test mode only) ---------- */
function botShop(b){
  for (const id of BOT_BUILD[b.key]){
    if (b.items.length>=4) return;
    const it=ITEMS.find(i=>i.id===id); const owned=b.items.filter(x=>x===id).length; const want=BOT_BUILD[b.key].filter(x=>x===id).length;
    if (owned>=want) continue;
    if (b.gold>=it.cost){ b.gold-=it.cost; b.items.push(id); recalc(b); }
    return;
  }
}
function controlBot(b,dt){
  const ai=b.ai, me=G.me, hpR=b.hp/b.maxHp;
  ai.skillT-=dt; ai.laneT-=dt;
  if (inBase(b) || b.gold>1400) botShop(b);
  if (ai.laneT<=0){ ai.laneT=rand(30,50); ai.lane=(!me.dead && Math.abs(me.x-376)>60) ? (me.x<376?0:1) : (Math.random()<.5?0:1); }
  if (hpR<.28) ai.retreat=true; if (ai.retreat && hpR>.9) ai.retreat=false;
  const seeMe=targetable(me,1), dm=seeMe?dist(b,me):1e9;
  const tryCast=(i,cond)=>{ if (ai.skillT<=0 && cond && b.ranks[i]>0 && cast(b,i)){ ai.skillT=rand(.5,1.1); return true; } return false; };
  if (ai.retreat){
    if (b.key==='vael' && dm<170){ const sp=SPAWN[1], d=Math.hypot(sp.x-b.x,sp.y-b.y)||1; b.moving=true; b.mv={x:(sp.x-b.x)/d,y:(sp.y-b.y)/d}; tryCast(1,true); }
    if (b.key==='korr') tryCast(1,dm<200);
    moveTowards(b,SPAWN[1].x,SPAWN[1].y,speedOf(b,b.def.spd),dt,10); return;
  }
  const meUnderTower=G.ents.some(e=>e.kind==='tower'&&e.team===0&&!e.dead&&dist(e,me)<e.range), meRatio=me.hp/me.maxHp;
  const engage = seeMe && dm<300 && (!meUnderTower || meRatio<.2) && (hpR>=meRatio*.85 || dm<b.range+30);
  if (engage){
    if (b.key==='vael'){ tryCast(4,dm<300) || tryCast(2,dm<280) || tryCast(3,dm<200&&hpR>.5); }
    else { tryCast(2,dm<230) || tryCast(1,dm<120) || tryCast(3,dm<95) || tryCast(4,dm<260 && G.ents.some(e=>e.kind==='tower'&&e.team===1&&!e.dead&&dist(e,b)<280)); }
    const R=b.range+b.r+me.r-6;
    if (dm>R && b.root<=0) moveTowards(b,me.x,me.y,speedOf(b,b.def.spd),dt,R);
    else { b.moving=false; if (b.atkCd<=0) heroAttack(b,me); }
    return;
  }
  const mins=G.ents.filter(e=>e.kind==='minion'&&e.team===1&&!e.dead&&e.lane===ai.lane);
  let goal;
  if (mins.length){ const f=mins.reduce((a,e)=>e.y>a.y?e:a); goal={x:f.x,y:f.y-45}; }
  else { const tw=G.ents.find(e=>e.kind==='tower'&&e.team===1&&!e.dead&&(ai.lane===0?e.x<376:e.x>376)) || G.ents.find(e=>e.kind==='core'&&e.team===1); goal={x:tw.x,y:tw.y+60}; }
  const tank=tw=>G.ents.some(e=>e.kind==='minion'&&e.team===1&&!e.dead&&dist(e,tw)<tw.range-10);
  for (const tw of G.ents){ if ((tw.kind!=='tower'&&tw.kind!=='core')||tw.team!==0||tw.dead) continue;
    if (Math.hypot(goal.x-tw.x,goal.y-tw.y)<tw.range+25 && !tank(tw)){ const a=Math.atan2(goal.y-tw.y,goal.x-tw.x); goal={x:tw.x+Math.cos(a)*(tw.range+30),y:tw.y+Math.sin(a)*(tw.range+30)}; } }
  const near=enemiesIn(b.x,b.y,95,1).filter(e=>e.kind==='minion');
  if (b.key==='korr') tryCast(3,near.length>=3); else tryCast(2,near.length>=3);
  const tg=pickHeroTarget(b), tOk=tg && !((tg.kind==='tower'||tg.kind==='core') && !tank(tg));
  if (tOk){ b.moving=false; if (b.atkCd<=0) heroAttack(b,tg); }
  else if (b.root<=0) moveTowards(b,goal.x,goal.y,speedOf(b,b.def.spd),dt,12);
}

/* ---------- Minions ---------- */
function spawnWave(){
  G.wave++;
  const comp=['foot','foot','xbow']; if (G.wave>=5 && G.wave%3===0) comp.unshift('brute');
  const wmul=1+.05*(G.wave-1);
  for (const team of [0,1]) for (const lane of [0,1]){
    const mul=wmul*bonuses(team).troop;
    const path=team===0 ? LANES[lane] : LANES[lane].slice().reverse();
    comp.forEach((type,i)=>{ const D=MT[type], p=path[0];
      G.ents.push({id:G.id++, kind:'minion', type, D, team, lane, path, wp:1, x:p[0]+rand(-10,10), y:p[1]+(team===0?1:-1)*i*22, r:type==='brute'?12:9,
        hp:D.hp*mul, maxHp:D.hp*mul, dmg:D.dmg*mul, atk:rand(0,.5), stun:0, slowT:0, slow:0, kb:null, flash:0, ox:rand(-10,10), dead:false, face:1, img:IMG[type+(team===0?'-b':'-r')+'.png']}); });
  }
}
function minionTarget(m){
  let best=null, bd=1e9;
  for (const pass of [0,1,2]){
    for (const e of G.ents){
      if (!targetable(e,m.team)) continue;
      if (pass===0 && e.kind!=='minion') continue;
      if (pass===1 && e.kind!=='tower' && e.kind!=='core') continue;
      if (pass===2 && e.kind!=='hero') continue;
      const d=dist(m,e)-e.r; if (d<=m.D.aggro && d<bd){ bd=d; best=e; }
    }
    if (best) return best;
  }
  return null;
}
function updateMinion(m,dt){
  m.flash=Math.max(0,m.flash-dt); m.atk-=dt; if (m.slowT>0) m.slowT-=dt;
  if (m.kb){ m.x+=m.kb.vx*dt; m.y+=m.kb.vy*dt; m.kb.t-=dt; if (m.kb.t<=0) m.kb=null; return; }
  if (m.stun>0){ m.stun-=dt; return; }
  const tg=minionTarget(m), spd=speedOf(m,m.D.spd);
  if (tg){
    const R=m.D.range+m.r+tg.r, d=dist(m,tg);
    if (d>R){ m.face=Math.sign(tg.x-m.x)||m.face; m.x+=(tg.x-m.x)/d*spd*dt; m.y+=(tg.y-m.y)/d*spd*dt; }
    else if (m.atk<=0){
      m.atk=m.D.cd;
      if (m.D.ranged) G.projs.push({x:m.x,y:m.y-12,tgt:tg,spd:380,dmg:m.dmg,src:m,col:m.team?'#ff9a7a':'#8fdcff',w:2});
      else { hit(tg,m.dmg,m); G.slashes.push({x:tg.x,y:tg.y,a:Math.atan2(tg.y-m.y,tg.x-m.x),t:0,life:.16,col:'#dfe6ff',small:true}); }
    }
  } else if (m.wp<m.path.length){
    const p=m.path[m.wp], tx=p[0]+m.ox, ty=p[1], d=Math.hypot(tx-m.x,ty-m.y);
    if (d<14) m.wp++; else { m.face=Math.sign(tx-m.x)||m.face; m.x+=(tx-m.x)/d*spd*dt; m.y+=(ty-m.y)/d*spd*dt; }
  }
}

/* ---------- Structures ---------- */
function updateStruct(s,dt){
  if (s.dead) return;
  s.flash=Math.max(0,s.flash-dt); if (s.shieldT>0) s.shieldT-=dt; if (s.od>0) s.od-=dt;
  if (G.sudden && s.kind==='core') hit(s,s.maxHp*.006*dt,null);
  s.atk-=dt*(s.od>0?2:1);
  if (s.atk>0) return;
  let tg=null, bd=1e9; const eh=enemyHeroOf(s.team);
  if (targetable(eh,s.team) && eh.aggroT>0 && dist(s,eh)<=s.range) tg=eh;
  if (!tg) for (const e of G.ents){ if (e.kind!=='minion'||!targetable(e,s.team)) continue; const d=dist(s,e); if (d<=s.range&&d<bd){bd=d;tg=e;} }
  if (!tg && targetable(eh,s.team) && dist(s,eh)<=s.range) tg=eh;
  if (!tg) return;
  s.atk=s.cd;
  G.projs.push({x:s.x,y:s.y-(s.kind==='core'?50:62),tgt:tg,spd:480,dmg:s.dmg*(tg.kind==='hero'?1:1.4),src:s,col:s.od>0?'#ffd27a':TC[s.team],w:5,big:true});
}

/* ---------- Main update ---------- */
function update(dt){
  G.t+=dt;
  if (G.t>=G.nextWave){ spawnWave(); G.nextWave+=20; }
  if (!G.sudden && G.t>=480){ G.sudden=true; toast(t('sudden')); }
  for (const e of G.ents){ if (e.dead && e.kind!=='hero') continue; if (e.kind==='hero') updateHero(e,dt); else if (e.kind==='minion') updateMinion(e,dt); else updateStruct(e,dt); if (G.over) return; }
  const ms=G.ents.filter(e=>e.kind==='minion'&&!e.dead);
  for (let i=0;i<ms.length;i++) for (let j=i+1;j<ms.length;j++){ const a=ms[i], b=ms[j], dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy), m=a.r+b.r; if (d<m&&d>0){ const p=(m-d)/2; a.x-=dx/d*p; a.y-=dy/d*p; b.x+=dx/d*p; b.y+=dy/d*p; } }
  for (const p of G.projs){
    const tg=p.tgt; if (tg.dead){ p.done=true; continue; }
    const tx=tg.x, ty=tg.y-(tg.kind==='hero'||tg.kind==='minion'?8:30), dx=tx-p.x, dy=ty-p.y, d=Math.hypot(dx,dy), st=p.spd*dt;
    p.a=Math.atan2(dy,dx);
    if (d<=st+4){ p.done=true; hit(tg,p.dmg,p.src); burst(tx,ty,p.col,p.big?10:4,p.big?90:50,.3); if (p.big) sfx('boom'); }
    else { p.x+=dx/d*st; p.y+=dy/d*st; }
  }
  G.projs=G.projs.filter(p=>!p.done);
  for (const z of G.zones){
    z.t+=dt;
    if (z.k==='trap'){
      if (!z.used) for (const e of enemiesIn(z.x,z.y,z.r,z.team)){ hit(e,z.dmg,z.src); e.root=z.root; if (e.kind==='minion') e.stun=z.root; z.used=true; z.t=z.dur; G.rings.push({x:z.x,y:z.y,r0:5,r1:45,t:0,life:.4,col:'#b07cff',w:4}); break; }
    } else {
      z.tick-=dt;
      if (z.k==='rift') for (const e of enemiesIn(z.x,z.y,z.r,z.team)){ const d=Math.hypot(z.x-e.x,z.y-e.y)||1, pull=Math.min(d,80*dt); e.x+=(z.x-e.x)/d*pull; e.y+=(z.y-e.y)/d*pull; }
      if (z.tick<=0){ z.tick=.5; for (const e of enemiesIn(z.x,z.y,z.r,z.team)){ hit(e,z.dmg*(z.k==='rain'?1:.5),z.src); if (z.k==='rain'){ e.slow=z.slow; e.slowT=1; } } }
    }
  }
  G.zones=G.zones.filter(z=>z.t<z.dur);
  G.ents=G.ents.filter(e=>!(e.kind==='minion'&&e.dead));
}
function updateFx(dt){
  for (const p of G.parts){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=1-2*dt; p.vy*=1-2*dt; }
  G.parts=G.parts.filter(p=>p.life>0);
  for (const a of [G.rings,G.slashes]) for (const r of a) r.t+=dt;
  G.rings=G.rings.filter(r=>r.t<r.life); G.slashes=G.slashes.filter(r=>r.t<r.life);
  for (const x of G.texts) x.age+=dt; G.texts=G.texts.filter(x=>x.age<x.life);
  G.shake=Math.max(0,G.shake-dt);
}

const touchEl=$('touch'), joy=$('joy'), knob=$('knob');
touchEl.addEventListener('pointerdown',e=>{

const BUILDABLE=['goldmine','extractor','treasury','forge','barracks','tower','workshop'];
function initBase(){
  if (P.base) return;

const allB = () => [P.base.core, ...P.base.plots.filter(Boolean)];
function fortLevels(){ const L={core:P.base.core.lvl}; for (const k of BUILDABLE) L[k]=Math.max(0,...P.base.plots.filter(p=>p&&p.t===k).map(p=>p.lvl)); return L; }

function fmtT(sec){ sec=Math.max(0,Math.ceil(sec)); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s2=sec%60; return h?`${h}h ${String(m).padStart(2,'0')}m`:m?`${m}m ${String(s2).padStart(2,'0')}s`:`${s2}s`; }
function effectText(t2,l){

function canStart(t2,fromLvl){

function startJob(b){

function tickBase(){

function collect(b){

      <p class="sub">${won?t('wonSub',{t:time}):t('lostSub',{t:time})}</p>
      <div class="stats"><div><small>${t('sKills')}</small>${st.k}</div><div><small>${t('sDeaths')}</small>${st.d}</div><div><small>${t('sCs')}</small>${st.cs}</div><div><small>${t('sLvl')}</small>${G.me.lvl}</div><div><small>${t('sGold')}</small>${Math.floor(st.gold)}</div></div>
      <p class="label">${t('rewards')}</p>
      <div class="rewards"><div class="r"><span>${t('rXp')}</span><span>+${xp}</span></div><div class="r"><span>${t('rGoldL')}</span><span>+${gGot}${gGot<gd?' ('+t('storage')+' '+t('full')+')':''}</span></div><div class="r"><span>${t('rCr')}</span><span>+${cGot}</span></div>${P.lvl>before?`<div class="r"><span>${t('acctUp',{n:P.lvl})}</span><span></span></div>`:''}</div>
      <button class="play" id="home">${t('toFortress')}</button></div>`, won?'base.jpg':null);
    $('home').onclick=()=>{ G=null; $('hud').hidden=true; showBase(); };
  },1400);
}

/* ---------- Loop ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if (G){ keyInput(); if (!G.paused && !G.over) update(dt); updateFx(dt); if (G){ draw(); updateHud(); } }
  requestAnimationFrame(loop);
}
document.documentElement.lang=LANG;
screen(`<div class="search"><h1 class="logo">Rift Keepers</h1><p class="sub">${t('loading')}</p></div>`);
resize();
ready.then(()=>{ showBase(); requestAnimationFrame(loop); });
window.__rk={ get G(){ return G; }, step(n){ for (let i=0;i<n && G && !G.over;i++){ update(1/30); updateFx(1/30); } }, cast(i){ return cast(G.me,i); }, learn(i){ learn(G.me,i); }, buy, input, P };
})();
</script>
